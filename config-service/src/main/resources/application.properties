server.port=8888
spring.application.name=config-service

# Absolute path; the default assumes startup from the config-service directory.
config.repo.path=${CONFIG_REPO_PATH:${user.dir}/../config-repo}
spring.cloud.config.server.git.uri=file://${config.repo.path}
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.try-master-branch=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
